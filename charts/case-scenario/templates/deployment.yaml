{{- if .Values.features.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (default "training" .Values.global.baseName) .Values.global.scenario | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ if .Values.features.rbac.enabled -}}{{ printf "%s-%s" (default "training" .Values.global.baseName) .Values.global.scenario | trunc 63 | trimSuffix "-" }}{{- else -}} default {{- end }}
      containers:
        - name: app
          image: {{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default "latest" }}
          command:
            - 'sleep'
          args:
            - '9999'
          ports:
            - containerPort: {{ .Values.app.targetPort | default 8080 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ printf "%s-pvc-%s" (default "training" .Values.global.baseName) .Values.global.scenario | trunc 63 | trimSuffix "-" }}
{{- end }}
